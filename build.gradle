plugins {
    id 'java'
}

group = 'org.mobilesr'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

def selenideVersion = "6.13.0",
    restAssuredVersion = "5.3.0",
    allureVersion = "2.21.0",
    junitVersion = "5.9.3",
    lombokVersion = "1.18.30",
    slf4jVersion = "2.0.7"

